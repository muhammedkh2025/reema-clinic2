<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>نظام إدارة عيادة ريما لطب وتجميل الأسنان</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <!-- Babel for browser JSX compilation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');
        * {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const fmtDate = (addDays = 0) => {
            const d = new Date();
            d.setDate(d.getDate() + addDays);
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        };

        const TODAY = fmtDate(0);

        const INITIAL_DOCTORS = [
            { id: 1, username: "reema", pass: "1234", name: "د. ريما العبيدي", specialty: "تقويم وتجميل الأسنان", phone: "07701112233", shift: "صباحي (09:00 - 02:00)", percentage: 50, color: "border-teal-500" },
            { id: 2, username: "ali", pass: "1234", name: "د. علي الحسان", specialty: "جراحة الفك وزراعة الأسنان", phone: "07802223344", shift: "مسائي (03:00 - 09:00)", percentage: 40, color: "border-blue-500" },
            { id: 3, username: "maryam", pass: "1234", name: "د. مريم الحيدري", specialty: "حشوات تجميلية وعلاج جذور", phone: "07714445566", shift: "مسائي (04:00 - 10:00)", percentage: 45, color: "border-purple-500" }
        ];

        const INITIAL_PATIENTS = [
            { 
                id: 101, 
                name: "محمد جاسم الكرخي", 
                phone: "07712345678", 
                dob: "1990-05-12", 
                address: "بغداد - الكرادة", 
                allergies: "حساسية من البنسلين", 
                medicalHistory: "ضغط الدم مرتفع خفيفاً", 
                teethState: { 11: "مخلوع", 12: "حشوة ضوئية", 21: "تاج زركون", 46: "تسوس عميق" }, 
                treatments: [
                    { id: "t1", date: "2026-10-10", doctor: "د. ريما العبيدي", procedure: "حشوة ضوئية للسن 12", cost: 50000, paid: 50000 },
                    { id: "t2", date: "2026-10-20", doctor: "د. علي الحسان", procedure: "قلع جراحي للسن 38", cost: 75000, paid: 75000 }
                ] 
            },
            { 
                id: 102, 
                name: "سارة أحمد الزاملي", 
                phone: "07898765432", 
                dob: "1995-11-20", 
                address: "بغداد - المنصور", 
                allergies: "لا يوجد", 
                medicalHistory: "سليمة صحياً", 
                teethState: { 13: "تبييض", 23: "تبييض" }, 
                treatments: [
                    { id: "t3", date: "2026-10-15", doctor: "د. مريم الحيدري", procedure: "جلسة تنظيف وتبييض زوم", cost: 120000, paid: 120000 }
                ] 
            }
        ];

        const INITIAL_APPOINTMENTS = [
            { id: 1, patientId: 101, patientName: "محمد جاسم الكرخي", patientPhone: "07712345678", doctorId: 1, date: TODAY, time: "10:00", status: "Confirmed", service: "حشوة ضوئية", cost: 50000, paid: 50000 },
            { id: 2, patientId: 102, patientName: "سارة أحمد الزاملي", patientPhone: "07898765432", doctorId: 2, date: TODAY, time: "11:30", status: "Waiting", service: "تنظيف وتبييض", cost: 75000, paid: 25000 }
        ];

        const INITIAL_FINANCE = [
            { id: 1, type: "Income", title: "حشوة ضوئية - محمد جاسم", amount: 50000, category: "العلاج", date: TODAY, doctorId: 1 },
            { id: 2, type: "Expense", title: "شراء مخدر أسنان ومستلزمات", amount: 45000, category: "مستلزمات طبية", date: TODAY, doctorId: null }
        ];

        const INITIAL_PRESCRIPTIONS = [
            {
                id: "rx101",
                patientId: 101,
                patientName: "محمد جاسم الكرخي",
                doctorName: "د. علي الحسان",
                procedure: "قلع جراحي للسن 38",
                date: TODAY,
                medicines: [
                    { name: "Amoxicillin 500mg", dose: "كبسولة كل 8 ساعات" },
                    { name: "Profanal 400mg", dose: "حبة عند الحاجة للألم" }
                ],
                notes: "تجنب المشروبات الساخنة لمدة 24 ساعة.",
                sentToPatient: true
            }
        ];

        const Icon = ({ name, className = "w-4 h-4" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        function DigitalClock() {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-lg text-[10px] font-mono text-teal-600 dark:text-teal-400 font-bold">
                    <Icon name="clock" className="w-3 h-3 animate-pulse" />
                    <span>{time.toLocaleTimeString('ar-IQ')}</span>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [darkMode, setDarkMode] = useState(true);
            const [userRole, setUserRole] = useState('system_manager'); 
            const [loggedInUser, setLoggedInUser] = useState(null);
            
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [loginInput, setLoginInput] = useState({ username: "", pass: "" });
            const [loginError, setLoginError] = useState("");

            const [doctors, setDoctors] = useState(INITIAL_DOCTORS);
            const [patients, setPatients] = useState(INITIAL_PATIENTS);
            const [appointments, setAppointments] = useState(INITIAL_APPOINTMENTS);
            const [finances, setFinances] = useState(INITIAL_FINANCE);
            const [prescriptions, setPrescriptions] = useState(INITIAL_PRESCRIPTIONS);
            const [attendanceRecords, setAttendanceRecords] = useState({});

            const [selectedPatientId, setSelectedPatientId] = useState(101);
            const [showAppModal, setShowAppModal] = useState(false);
            const [selectedPatientChart, setSelectedPatientChart] = useState(null);
            const [selectedToothModal, setSelectedToothModal] = useState(null);
            const [toothStatusText, setToothStatusText] = useState("");
            const [newApp, setNewApp] = useState({ patientName: "", patientPhone: "", doctorId: 1, date: TODAY, time: "12:00", service: "كشفية واستشارة", cost: 25000, paid: 25000 });

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            const handleRoleChange = (role) => {
                if (role === 'doctor' || role === 'admin') {
                    setUserRole(role);
                    setShowLoginModal(true);
                } else if (role === 'patient') {
                    setUserRole('patient');
                    setLoggedInUser(null);
                    setActiveTab('patient_portal');
                } else {
                    setUserRole('system_manager');
                    setLoggedInUser({ name: "مدير النظام" });
                    setActiveTab('dashboard');
                }
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                if (userRole === 'doctor') {
                    const doc = doctors.find(d => d.username === loginInput.username && d.pass === loginInput.pass);
                    if (doc) {
                        setLoggedInUser(doc);
                        setShowLoginModal(false);
                        setLoginError("");
                        setActiveTab('appointments');
                    } else {
                        setLoginError("اسم المستخدم أو كلمة السر غير صحيحة");
                    }
                } else {
                    if (loginInput.username === "admin" && loginInput.pass === "1234") {
                        setLoggedInUser({ name: "الأدمن المركزي" });
                        setShowLoginModal(false);
                        setLoginError("");
                        setActiveTab('dashboard');
                    } else {
                        setLoginError("بيانات الدخول غير صحيحة (افتراضي: admin / 1234)");
                    }
                }
            };

            const handleCheckIn = (userName) => {
                const nowTime = new Date().toLocaleTimeString('ar-IQ');
                setAttendanceRecords({ ...attendanceRecords, [userName]: { status: "حاضر", timeIn: nowTime, timeOut: null } });
            };

            const handleCheckOut = (userName) => {
                const nowTime = new Date().toLocaleTimeString('ar-IQ');
                if (attendanceRecords[userName]) {
                    setAttendanceRecords({ ...attendanceRecords, [userName]: { ...attendanceRecords[userName], status: "مغادر", timeOut: nowTime } });
                }
            };

            const todayIncome = useMemo(() => {
                return finances.filter(f => f.type === 'Income' && f.date === TODAY).reduce((acc, curr) => acc + curr.amount, 0);
            }, [finances]);

            const handleAddAppointment = (e) => {
                e.preventDefault();
                const app = {
                    id: Date.now(),
                    patientId: Date.now() + 1,
                    patientName: newApp.patientName,
                    patientPhone: newApp.patientPhone,
                    doctorId: Number(newApp.doctorId),
                    date: newApp.date,
                    time: newApp.time,
                    status: "Confirmed",
                    service: newApp.service,
                    cost: Number(newApp.cost),
                    paid: Number(newApp.paid)
                };
                setAppointments([app, ...appointments]);
                setShowAppModal(false);
            };

            const handleSaveToothState = () => {
                if (!selectedPatientChart || !selectedToothModal) return;
                const updatedTeeth = { ...selectedPatientChart.teethState, [selectedToothModal]: toothStatusText || "معالجة" };
                const updatedPat = { ...selectedPatientChart, teethState: updatedTeeth };
                setSelectedPatientChart(updatedPat);
                setPatients(patients.map(p => p.id === updatedPat.id ? updatedPat : p));
                setSelectedToothModal(null);
                setToothStatusText("");
            };

            const currentPatient = useMemo(() => {
                return patients.find(p => p.id === selectedPatientId) || patients[0];
            }, [patients, selectedPatientId]);

            return (
                <div className="min-h-screen flex flex-col font-sans bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
                    {/* TOP HEADER */}
                    <header className="bg-white/90 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-3 py-2.5 flex items-center justify-between sticky top-0 z-40">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-xl bg-teal-500 flex items-center justify-center text-white font-black text-lg shadow-lg shadow-teal-500/20">
                                🦷
                            </div>
                            <div>
                                <h1 className="text-xs sm:text-sm font-extrabold text-teal-600 dark:text-teal-400">
                                    عيادة ريما لطب وتجميل الأسنان
                                </h1>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <DigitalClock />
                            <select 
                                value={userRole} 
                                onChange={e => handleRoleChange(e.target.value)}
                                className="bg-slate-100 dark:bg-slate-800 font-bold text-[11px] text-teal-600 dark:text-teal-400 outline-none p-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                                <option value="system_manager">👑 مدير النظام</option>
                                <option value="admin">🛡️ الأدمن</option>
                                <option value="doctor">🩺 الطبيب</option>
                                <option value="patient">👤 المريض</option>
                            </select>
                            <button 
                                onClick={() => setDarkMode(!darkMode)}
                                className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-amber-500 dark:text-amber-400">
                                <Icon name={darkMode ? "sun" : "moon"} className="w-3.5 h-3.5" />
                            </button>
                        </div>
                    </header>

                    {/* RESPONSIVE NAVIGATION BAR FOR MOBILE & DESKTOP */}
                    <div className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-3 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar">
                        <span className="text-[11px] font-bold text-slate-400 whitespace-nowrap">الأقسام:</span>
                        {(userRole === 'system_manager' || userRole === 'admin') && (
                            <>
                                <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-1.5 rounded-lg font-bold text-xs whitespace-nowrap transition ${activeTab === 'dashboard' ? 'bg-teal-500 text-white shadow' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>لوحة التحكم</button>
                                <button onClick={() => setActiveTab('appointments')} className={`px-3 py-1.5 rounded-lg font-bold text-xs whitespace-nowrap transition ${activeTab === 'appointments' ? 'bg-teal-500 text-white shadow' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>الحجوزات والجدول</button>
                                <button onClick={() => setActiveTab('patients')} className={`px-3 py-1.5 rounded-lg font-bold text-xs whitespace-nowrap transition ${activeTab === 'patients' ? 'bg-teal-500 text-white shadow' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>المرضى والملفات</button>
                                <button onClick={() => setActiveTab('prescriptions')} className={`px-3 py-1.5 rounded-lg font-bold text-xs whitespace-nowrap transition ${activeTab === 'prescriptions' ? 'bg-teal-500 text-white shadow' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>الوصفات (Rx)</button>
                                <button onClick={() => setActiveTab('attendance')} className={`px-3 py-1.5 rounded-lg font-bold text-xs whitespace-nowrap transition ${activeTab === 'attendance' ? 'bg-teal-500 text-white shadow' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>البصمة والشؤون</button>
                            </>
                        )}
                        {userRole === 'doctor' && (
                            <>
                                <button onClick={() => setActiveTab('appointments')} className={`px-3 py-1.5 rounded-lg font-bold text-xs whitespace-nowrap transition ${activeTab === 'appointments' ? 'bg-teal-500 text-white shadow' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>مواعيدي والكشف</button>
                                <button onClick={() => setActiveTab('patients')} className={`px-3 py-1.5 rounded-lg font-bold text-xs whitespace-nowrap transition ${activeTab === 'patients' ? 'bg-teal-500 text-white shadow' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>سجلات المرضى والمخطط</button>
                                <button onClick={() => setActiveTab('prescriptions')} className={`px-3 py-1.5 rounded-lg font-bold text-xs whitespace-nowrap transition ${activeTab === 'prescriptions' ? 'bg-teal-500 text-white shadow' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>كتابة وصفة (Rx)</button>
                            </>
                        )}
                        {userRole === 'patient' && (
                            <>
                                <button onClick={() => setActiveTab('patient_portal')} className={`px-3 py-1.5 rounded-lg font-bold text-xs whitespace-nowrap transition ${activeTab === 'patient_portal' ? 'bg-teal-500 text-white shadow' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>صفحة المريض الخاصة</button>
                            </>
                        )}
                    </div>

                    <main className="flex-1 p-3 sm:p-5 space-y-4">
                        {/* DASHBOARD VIEW */}
                        {activeTab === 'dashboard' && (userRole === 'system_manager' || userRole === 'admin') && (
                            <div className="space-y-4">
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                                        <p className="text-xs text-slate-400 font-bold">إجمالي المرضى</p>
                                        <p className="text-xl font-black text-teal-500">{patients.length}</p>
                                    </div>
                                    <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                                        <p className="text-xs text-slate-400 font-bold">حجوزات اليوم</p>
                                        <p className="text-xl font-black text-blue-500">{appointments.length}</p>
                                    </div>
                                    <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                                        <p className="text-xs text-slate-400 font-bold">إيراد اليوم</p>
                                        <p className="text-xl font-black text-emerald-500">{todayIncome.toLocaleString()} د.ع</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ATTENDANCE VIEW */}
                        {activeTab === 'attendance' && (
                            <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
                                <h3 className="text-xs font-bold text-teal-500">نظام البصمة اليومية وحضور الكادر</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    {doctors.map(doc => {
                                        const rec = attendanceRecords[doc.name];
                                        return (
                                            <div key={doc.id} className="p-3 rounded-xl border border-slate-200 dark:border-slate-800 space-y-2 bg-slate-50 dark:bg-slate-950">
                                                <p className="font-bold text-xs">{doc.name}</p>
                                                <p className="text-[10px] text-slate-400">الحالة: <span className="text-teal-400 font-bold">{rec?.status || 'لم يبصم'}</span></p>
                                                <div className="flex gap-2 pt-1">
                                                    <button onClick={() => handleCheckIn(doc.name)} className="flex-1 py-1 bg-emerald-500 text-white rounded-lg text-[11px] font-bold">حضور</button>
                                                    <button onClick={() => handleCheckOut(doc.name)} className="flex-1 py-1 bg-rose-500 text-white rounded-lg text-[11px] font-bold">انصراف</button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* PATIENT PORTAL */}
                        {activeTab === 'patient_portal' && (
                            <div className="space-y-4">
                                <div className="bg-teal-600 text-white p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                    <div>
                                        <h3 className="font-bold text-sm">بوابة المريض الخاصة 🦷</h3>
                                        <p className="text-[11px] opacity-80">يمكنك مشاهدة مواعيدك ووصفاتك الطبية فورياً</p>
                                    </div>
                                    <select value={selectedPatientId} onChange={e => setSelectedPatientId(Number(e.target.value))} className="bg-white text-slate-800 p-2 rounded-xl text-xs font-bold w-full sm:w-auto">
                                        {patients.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                    </select>
                                </div>
                                <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2 shadow-sm">
                                    <h4 className="font-bold text-xs text-teal-500">تفاصيل المريض:</h4>
                                    <p className="text-xs">الاسم: {currentPatient?.name}</p>
                                    <p className="text-xs text-slate-400">رقم الهاتف: {currentPatient?.phone}</p>
                                </div>
                            </div>
                        )}

                        {/* APPOINTMENTS VIEW */}
                        {activeTab === 'appointments' && (
                            <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3 shadow-sm">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-xs text-teal-500">جدول الحجوزات</h3>
                                    <button onClick={() => setShowAppModal(true)} className="px-3 py-1 bg-teal-500 text-white rounded-xl text-xs font-bold">+ حجز جديد</button>
                                </div>
                                <div className="space-y-2">
                                    {appointments.map(a => (
                                        <div key={a.id} className="p-3 bg-slate-50 dark:bg-slate-950 rounded-xl flex justify-between items-center text-xs border border-slate-200 dark:border-slate-800">
                                            <div>
                                                <p className="font-bold">{a.patientName}</p>
                                                <p className="text-[10px] text-slate-400">{a.service} | {a.time}</p>
                                            </div>
                                            <span className="px-2 py-1 bg-teal-500/10 text-teal-500 font-bold rounded-md text-[10px]">{a.status}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* PATIENTS VIEW */}
                        {activeTab === 'patients' && (
                            <div className="space-y-3">
                                <h3 className="font-bold text-xs text-teal-500">سجلات المرضى والمخطط التفاعلي (32 سن)</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {patients.map(p => (
                                        <div key={p.id} className="p-3 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2 shadow-sm">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h4 className="font-bold text-xs">{p.name}</h4>
                                                    <p className="text-[10px] text-slate-400">{p.phone}</p>
                                                </div>
                                                <button onClick={() => setSelectedPatientChart(p)} className="px-2.5 py-1 bg-teal-500 text-white rounded-xl text-[10px] font-bold">المخطط (FDI)</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* LOGIN MODAL */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="w-full max-w-sm p-5 bg-white dark:bg-slate-900 rounded-3xl space-y-3 shadow-2xl">
                                <h3 className="font-bold text-xs text-teal-500 text-center">تسجيل دخول {userRole === 'doctor' ? 'الطبيب' : 'الأدمن'}</h3>
                                <form onSubmit={handleLoginSubmit} className="space-y-3 text-xs">
                                    <input type="text" placeholder="اسم المستخدم (مثال: reema)" required value={loginInput.username} onChange={e => setLoginInput({...loginInput, username: e.target.value})} className="w-full p-2.5 rounded-xl border bg-slate-100 dark:bg-slate-800 outline-none" />
                                    <input type="password" placeholder="كلمة السر (الافتراضي: 1234)" required value={loginInput.pass} onChange={e => setLoginInput({...loginInput, pass: e.target.value})} className="w-full p-2.5 rounded-xl border bg-slate-100 dark:bg-slate-800 outline-none" />
                                    {loginError && <p className="text-rose-500 text-[10px]">{loginError}</p>}
                                    <button type="submit" className="w-full py-2.5 bg-teal-500 text-white font-bold rounded-xl shadow">دخول</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ADD APPOINTMENT MODAL */}
                    {showAppModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="w-full max-w-sm p-5 bg-white dark:bg-slate-900 rounded-3xl space-y-3 shadow-2xl">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-xs text-teal-500">حجز موعد جديد</h3>
                                    <button onClick={() => setShowAppModal(false)}>✕</button>
                                </div>
                                <form onSubmit={handleAddAppointment} className="space-y-3 text-xs">
                                    <input type="text" placeholder="اسم المريض" required value={newApp.patientName} onChange={e => setNewApp({...newApp, patientName: e.target.value})} className="w-full p-2.5 rounded-xl border bg-slate-100 dark:bg-slate-800 outline-none" />
                                    <input type="text" placeholder="رقم الهاتف" required value={newApp.patientPhone} onChange={e => setNewApp({...newApp, patientPhone: e.target.value})} className="w-full p-2.5 rounded-xl border bg-slate-100 dark:bg-slate-800 outline-none" />
                                    <button type="submit" className="w-full py-2.5 bg-teal-500 text-white font-bold rounded-xl shadow">تأكيد الموعد</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* DENTAL CHART MODAL */}
                    {selectedPatientChart && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="w-full max-w-2xl p-4 bg-white dark:bg-slate-900 rounded-3xl space-y-3 max-h-[90vh] overflow-y-auto shadow-2xl">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-xs text-teal-500">المخطط (32 سن): {selectedPatientChart.name}</h3>
                                    <button onClick={() => setSelectedPatientChart(null)}>✕</button>
                                </div>
                                <div className="grid grid-cols-4 sm:grid-cols-8 gap-1.5">
                                    {[18,17,16,15,14,13,12,11, 21,22,23,24,25,26,27,28, 48,47,46,45,44,43,42,41, 31,32,33,34,35,36,37,38].map(num => (
                                        <button key={num} onClick={() => setSelectedToothModal(num)} className="p-1.5 border rounded-lg text-center hover:border-teal-500 text-[11px]">
                                            <span>🦷</span>
                                            <p className="font-bold">#{num}</p>
                                        </button>
                                    ))}
                                </div>
                                {selectedToothModal && (
                                    <div className="p-3 bg-slate-100 dark:bg-slate-800 rounded-xl space-y-2 text-xs">
                                        <p className="font-bold">تشخيص للسن #{selectedToothModal}:</p>
                                        <input type="text" placeholder="أدخل التشخيص..." value={toothStatusText} onChange={e => setToothStatusText(e.target.value)} className="w-full p-2 rounded-xl bg-white dark:bg-slate-900 outline-none border" />
                                        <button onClick={handleSaveToothState} className="px-3 py-1.5 bg-teal-500 text-white rounded-lg font-bold">حفظ الحالة</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>

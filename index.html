        function DigitalClock({ lang }) {
            const [time, setTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const timeString = time.toLocaleTimeString(lang === 'ar' ? 'ar-IQ' : 'en-US', {
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });

            const dateString = time.toLocaleDateString(lang === 'ar' ? 'ar-IQ' : 'en-US', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });

            return (
                <div className="flex items-center gap-3 bg-slate-100 dark:bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
                    <div className="flex items-center gap-1.5 text-teal-600 dark:text-teal-400 font-mono font-black text-xs sm:text-sm">
                        <Icon name="clock" className="w-4 h-4 animate-pulse" />
                        <span>{timeString}</span>
                    </div>
                    <span className="text-slate-300 dark:text-slate-600">|</span>
                    <span className="text-[11px] font-bold text-slate-600 dark:text-slate-300 hidden md:inline">
                        {dateString}
                    </span>
                </div>
            );
        }

            const [doctors, setDoctors] = useState(() => JSON.parse(localStorage.getItem('reema_doctors')) || INITIAL_DOCTORS);
            const [patients, setPatients] = useState(() => JSON.parse(localStorage.getItem('reema_patients')) || INITIAL_PATIENTS);
            const [appointments, setAppointments] = useState(() => JSON.parse(localStorage.getItem('reema_appointments')) || INITIAL_APPOINTMENTS);
            const [finances, setFinances] = useState(() => JSON.parse(localStorage.getItem('reema_finances')) || INITIAL_FINANCE);
            const [shortages, setShortages] = useState(() => JSON.parse(localStorage.getItem('reema_shortages')) || INITIAL_SHORTAGES);
            const [prescriptions, setPrescriptions] = useState(() => JSON.parse(localStorage.getItem('reema_prescriptions')) || INITIAL_PRESCRIPTIONS);
            
            const [attendance, setAttendance] = useState({ 1: { days: { [TODAY]: { in: Date.now(), out: null } } } });

            // HIERARCHY & ROLES: "system_manager" (مدير النظام) -> "admin" (الأدمن) -> "doctor" (الطبيب) -> "patient" (المريض)
            const [userRole, setUserRole] = useState('system_manager');
            const [selectedPatientPortalId, setSelectedPatientPortalId] = useState(101);
            const [selectedDoctorId, setSelectedDoctorId] = useState(1);

            const [showAppModal, setShowAppModal] = useState(false);
            const [showDocModal, setShowDocModal] = useState(false);
            const [showPatModal, setShowPatModal] = useState(false);
            const [showExpModal, setShowExpModal] = useState(false);
            const [selectedPatientChart, setSelectedPatientChart] = useState(null);
            const [selectedToothModal, setSelectedToothModal] = useState(null);
            const [toothStatusText, setToothStatusText] = useState("");
            const [printReceiptData, setPrintReceiptData] = useState(null);
            const [conflictAlert, setConflictAlert] = useState(null);

            const [prescriptionModal, setPrescriptionModal] = useState(null);
            const [rxMedList, setRxMedList] = useState([{ name: "", dose: "" }]);
            const [rxNotes, setRxNotes] = useState("");
            const [createdRxPrint, setCreatedRxPrint] = useState(null);

            const [searchQuery, setSearchQuery] = useState("");
            const [docFilter, setDocFilter] = useState("all");
            const [statusFilter, setStatusFilter] = useState("all");

            const [newApp, setNewApp] = useState({ patientName: "", patientPhone: "", doctorId: 1, date: TODAY, time: "12:00", service: "كشفية واستشارة", cost: 25000, paid: 25000 });
            const [newDoc, setNewDoc] = useState({ name: "", specialty: "", phone: "", shift: "صباحي (09:00 - 02:00)", percentage: 40 });
            const [newPat, setNewPat] = useState({ name: "", phone: "", dob: "1995-01-01", address: "بغداد", allergies: "", medicalHistory: "" });
            const [newExp, setNewExp] = useState({ title: "", amount: 10000, category: "مستلزمات طبية" });
            const [newShortage, setNewShortage] = useState({ item: "", qty: "", urgency: "عادي", note: "" });

            useEffect(() => {
                localStorage.setItem('reema_lang', lang);
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            }, [lang]);

            useEffect(() => {
                localStorage.setItem('reema_dark', darkMode);
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            useEffect(() => localStorage.setItem('reema_doctors', JSON.stringify(doctors)), [doctors]);
            useEffect(() => localStorage.setItem('reema_patients', JSON.stringify(patients)), [patients]);
            useEffect(() => localStorage.setItem('reema_appointments', JSON.stringify(appointments)), [appointments]);
            useEffect(() => localStorage.setItem('reema_finances', JSON.stringify(finances)), [finances]);
            useEffect(() => localStorage.setItem('reema_shortages', JSON.stringify(shortages)), [shortages]);
            useEffect(() => localStorage.setItem('reema_prescriptions', JSON.stringify(prescriptions)), [prescriptions]);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const t = TRANSLATIONS[lang];

            const todayIncome = useMemo(() => {
                return finances.filter(f => f.type === 'Income' && f.date === TODAY).reduce((acc, curr) => acc + curr.amount, 0);
            }, [finances]);

            const handleAddDoctor = (e) => {
                e.preventDefault();
                if (!newDoc.name) return;
                const colors = ["border-teal-500", "border-blue-500", "border-purple-500", "border-emerald-500"];
                const doc = { ...newDoc, id: Date.now(), color: colors[doctors.length % colors.length] };
                setDoctors([...doctors, doc]);
                setShowDocModal(false);
                setNewDoc({ name: "", specialty: "", phone: "", shift: "صباحي (09:00 - 02:00)", percentage: 40 });
            };

            const handleAddPatient = (e) => {
                e.preventDefault();
                if (!newPat.name || !newPat.phone) return;
                const pat = { ...newPat, id: Date.now(), teethState: {}, treatments: [] };
                setPatients([...patients, pat]);
                setShowPatModal(false);
                setNewPat({ name: "", phone: "", dob: "1995-01-01", address: "بغداد", allergies: "", medicalHistory: "" });
            };

            const handleAddAppointment = (e) => {
                e.preventDefault();
                if (!newApp.patientName) return;
                const docId = Number(newApp.doctorId);
                const cost = Number(newApp.cost);
                const paid = Number(newApp.paid);

                const conflict = appointments.find(a => 
                    a.doctorId === docId && 
                    a.date === newApp.date && 
                    a.time === newApp.time &&
                    a.status !== 'Cancelled'
                );

                if (conflict) {
                    const docObj = doctors.find(d => d.id === docId);
                    setConflictAlert({
                        doctorName: docObj?.name || "الطبيب",
                        time: newApp.time,
                        date: newApp.date,
                        existingPatient: conflict.patientName
                    });
                    return;
                }

                const app = {
                    id: Date.now(),
                    patientId: Date.now() + 1,
                    patientName: newApp.patientName,
                    patientPhone: newApp.patientPhone,
                    doctorId: docId,
                    date: newApp.date,
                    time: newApp.time,
                    status: "Confirmed",
                    service: newApp.service,
                    cost: cost,
                    paid: paid
                };

                const cleanPhone = newApp.patientPhone.trim();
                const existingPat = patients.find(p => p.phone === cleanPhone);
                if (!existingPat && cleanPhone) {
                    setPatients(prev => [...prev, {
                        id: app.patientId,
                        name: newApp.patientName,
                        phone: cleanPhone,
                        dob: "1995-01-01",
                        address: "بغداد",
                        allergies: "",
                        medicalHistory: "",
                        teethState: {},
                        treatments: []
                    }]);
                }

                setAppointments([app, ...appointments]);

                if (paid > 0) {
                    setFinances(prev => [{
                        id: Date.now() + 2,
                        type: "Income",
                        title: `${newApp.service} - ${newApp.patientName}`,
                        amount: paid,
                        category: "العلاج",
                        date: newApp.date,
                        doctorId: docId
                    }, ...prev]);
                }

                setShowAppModal(false);
                setNewApp({ patientName: "", patientPhone: "", doctorId: doctors[0]?.id || 1, date: TODAY, time: "12:00", service: "كشفية واستشارة", cost: 25000, paid: 25000 });
            };

            const handleUpdateAppointmentDoctor = (appId, newDocId) => {
                setAppointments(appointments.map(a => a.id === appId ? { ...a, doctorId: Number(newDocId) } : a));
            };

            const handleAddExpense = (e) => {
                e.preventDefault();
                if (!newExp.title) return;
                const exp = { id: Date.now(), type: "Expense", title: newExp.title, amount: Number(newExp.amount), category: newExp.category, date: TODAY, doctorId: null };
                setFinances([exp, ...finances]);
                setShowExpModal(false);
                setNewExp({ title: "", amount: 10000, category: "مستلزمات طبية" });
            };

            const handleUpdateStatus = (appId, status) => {
                setAppointments(appointments.map(a => a.id === appId ? { ...a, status } : a));
            };

            const sendWhatsAppReminder = (phone, name, date, time) => {
                const text = encodeURIComponent(`مرحباً ${name}، نود تذكيركم بموعدكم الطبي في عيادة ريما لطب الأسنان يوم ${date} الساعة ${time}. نتمنى لكم السلامة.`);
                window.open(`https://wa.me/964${phone.replace(/^0/, '')}?text=${text}`, '_blank');
            };

            const handleSaveToothState = () => {
                if (!selectedPatientChart || !selectedToothModal) return;
                const procedureName = toothStatusText || "معالجة أسنان";
                const updatedTeeth = { ...selectedPatientChart.teethState, [selectedToothModal]: procedureName };

                const currentDoc = doctors.find(d => d.id === selectedDoctorId);
                const newTreatment = {
                    id: 'tr_' + Date.now(),
                    date: TODAY,
                    doctor: currentDoc ? currentDoc.name : "د. ريما العبيدي",
                    procedure: `إجراء للسن #${selectedToothModal}: ${procedureName}`,
                    cost: 50000,
                    paid: 50000
                };

                const updatedPat = { 
                    ...selectedPatientChart, 
                    teethState: updatedTeeth,
                    treatments: [newTreatment, ...(selectedPatientChart.treatments || [])]
                };

                setSelectedPatientChart(updatedPat);
                setPatients(patients.map(p => p.id === updatedPat.id ? updatedPat : p));

                setPrescriptionModal({
                    patientId: updatedPat.id,
                    patientName: updatedPat.name,
                    patientPhone: updatedPat.phone,
                    doctorName: currentDoc ? currentDoc.name : "د. ريما العبيدي",
                    procedure: `معالجة السن #${selectedToothModal} (${procedureName})`
                });

                setToothStatusText("");
                setSelectedToothModal(null);
            };

            const handleSavePrescription = (e) => {
                e.preventDefault();
                if (!prescriptionModal) return;

                const validMeds = rxMedList.filter(m => m.name.trim() !== "");
                const newRx = {
                    id: 'rx_' + Date.now(),
                    patientId: prescriptionModal.patientId,
                    patientName: prescriptionModal.patientName,
                    patientPhone: prescriptionModal.patientPhone,
                    doctorName: prescriptionModal.doctorName,
                    procedure: prescriptionModal.procedure,
                    date: TODAY,
                    medicines: validMeds.length ? validMeds : [{ name: "مسكن ألم", dose: "عند الحاجة" }],
                    notes: rxNotes || "يرجى الالتزام بالجرعات المقررة.",
                    sentToPatient: false
                };

                setPrescriptions([newRx, ...prescriptions]);
                setCreatedRxPrint(newRx);
                setPrescriptionModal(null);
                setRxMedList([{ name: "", dose: "" }]);
                setRxNotes("");
            };

            const handleSendRxWhatsApp = (rx) => {
                let rxText = `🏥 *عيادة ريما لطب وتجميل الأسنان*\n`;
                rxText += `📋 *الوصفة الطبية (Rx)*\n`;
                rxText += `👤 المريض: ${rx.patientName}\n`;
                rxText += `👨‍⚕️ الطبيب: ${rx.doctorName}\n`;
                rxText += `🦷 الإجراء: ${rx.procedure}\n\n`;
                rxText += `💊 *الأدوية:*\n`;
                rx.medicines.forEach((m, idx) => {
                    rxText += `${idx + 1}. ${m.name} (${m.dose})\n`;
                });
                if (rx.notes) rxText += `\n📝 ملاحظات: ${rx.notes}\n`;

                const encoded = encodeURIComponent(rxText);
                window.open(`https://wa.me/964${(rx.patientPhone || '').replace(/^0/, '')}?text=${encoded}`, '_blank');
                setPrescriptions(prescriptions.map(item => item.id === rx.id ? { ...item, sentToPatient: true } : item));
            };

            const handleAddShortage = (e) => {
                e.preventDefault();
                if (!newShortage.item.trim()) return;
                const currentDoc = doctors.find(d => d.id === selectedDoctorId);
                const shortageItem = {
                    id: 's_' + Date.now(),
                    ...newShortage,
                    by: currentDoc ? currentDoc.name : "طبيب الأسنان",
                    docId: selectedDoctorId,
                    date: TODAY,
                    status: "new"
                };
                setShortages([shortageItem, ...shortages]);
                setNewShortage({ item: "", qty: "", urgency: "عادي", note: "" });
            };

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <header className="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 py-2.5 flex items-center justify-between sticky top-0 z-40 shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-teal-500 via-emerald-500 to-cyan-500 flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-teal-500/20">
                                🦷
                            </div>
                            <div>
                                <h1 className="text-base lg:text-lg font-extrabold bg-gradient-to-r from-teal-500 via-emerald-500 to-cyan-500 bg-clip-text text-transparent">
                                    {t.clinicName}
                                </h1>
                                <p className="text-[11px] text-slate-500 dark:text-slate-400 font-medium hidden sm:block">
                                    {t.subtitle}
                                </p>
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            <DigitalClock lang={lang} />
                            <BaghdadWeather />
                        </div>

                        <div className="flex items-center gap-2 lg:gap-3">
                            <div className="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs border border-slate-200 dark:border-slate-700">
                                <select 
                                    value={userRole} 
                                    onChange={e => {
                                        setUserRole(e.target.value);
                                        if (e.target.value === 'patient') setActiveTab('patient_portal');
                                        else if (activeTab === 'patient_portal') setActiveTab('dashboard');
                                    }}
                                    className="bg-transparent font-bold text-teal-600 dark:text-teal-400 outline-none cursor-pointer px-2 py-1">
                                    <option value="system_manager">👑 مدير النظام</option>
                                    <option value="admin">🛡️ الأدمن (Admin)</option>
                                    <option value="doctor">🩺 الطبيب</option>
                                    <option value="patient">👤 المريض</option>
                                </select>
                            </div>

                            {userRole === 'doctor' && (
                                <select 
                                    value={selectedDoctorId} 
                                    onChange={e => setSelectedDoctorId(Number(e.target.value))}
                                    className="bg-slate-100 dark:bg-slate-800 text-xs px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 outline-none font-bold">
                                    {doctors.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                                </select>
                            )}

                            <button 
                                onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')}
                                className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center gap-1.5">
                                <Icon name="globe" className="w-3.5 h-3.5 text-teal-500" />
                                <span>{t.langName}</span>
                            </button>

                            <button 
                                onClick={() => setDarkMode(!darkMode)}
                                className="p-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition text-amber-500">
                                <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                            </button>

                            {userRole !== 'patient' && (
                                <button 
                                    onClick={() => setShowAppModal(true)}
                                    className="hidden sm:flex px-3.5 py-1.5 bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-white text-xs font-bold rounded-xl items-center gap-1.5 shadow-md shadow-teal-500/20 transition active:scale-95">
                                    <Icon name="plus" className="w-4 h-4" />
                                    <span>{t.addApp}</span>
                                </button>
                            )}
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden">
                        <aside className="w-64 p-4 border-r dark:border-slate-800 bg-white dark:bg-slate-900 hidden md:flex flex-col justify-between">
                            <div className="space-y-1">
                                <div className="px-3 py-2 text-[11px] font-bold uppercase tracking-wider text-slate-400">
                                    {userRole === 'system_manager' ? 'صلاحيات: مدير النظام' :
                                     userRole === 'admin' ? 'صلاحيات: الأدمن' :
                                     userRole === 'doctor' ? 'صلاحيات: الطبيب المعالج' : 'بوابة المريض'}
                                </div>
                                {[
                                    { id: "dashboard", label: t.dashboard, icon: "layout-dashboard", roles: ["system_manager", "admin", "doctor"] },
                                    { id: "appointments", label: t.appointments, icon: "calendar", roles: ["system_manager", "admin", "doctor"] },
                                    { id: "reception", label: t.reception, icon: "clock", roles: ["system_manager", "admin", "doctor"] },
                                    { id: "patients", label: t.patients, icon: "users", roles: ["system_manager", "admin", "doctor"] },
                                    { id: "prescriptions", label: `${t.prescriptions} (℞)`, icon: "file-text", roles: ["system_manager", "admin", "doctor"] },
                                    { id: "doctors", label: t.doctors, icon: "stethoscope", roles: ["system_manager", "admin"] },
                                    { id: "shortages", label: `${t.shortages} (${shortages.filter(s=>s.status==='new').length})`, icon: "alert-triangle", roles: ["system_manager", "admin", "doctor"] },
                                    { id: "myhr", label: t.myhr, icon: "fingerprint", roles: ["system_manager", "doctor"] },
                                    { id: "finance", label: t.finance, icon: "dollar-sign", roles: ["system_manager", "admin"] },
                                    { id: "reports", label: t.reports, icon: "bar-chart-2", roles: ["system_manager", "admin"] },
                                    { id: "patient_portal", label: "بوابة المريض الصحية", icon: "user", roles: ["patient", "system_manager", "admin", "doctor"] },
                                ]
                                .filter(item => item.roles.includes(userRole))
                                .map((item) => {
                                    const active = activeTab === item.id;
                                    return (
                                        <button
                                            key={item.id}
                                            onClick={() => setActiveTab(item.id)}
                                            className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                                                active 
                                                    ? 'bg-gradient-to-r from-teal-500 to-emerald-500 text-white shadow-lg shadow-teal-500/20' 
                                                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60'
                                            }`}>
                                            <Icon name={item.icon} className={`w-4 h-4 ${active ? 'text-white' : 'text-teal-500'}`} />
                                            <span>{item.label}</span>
                                        </button>
                                    );
                                })}
                            </div>

                            <div className="p-3 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 mt-auto">
                                <div className="flex items-center gap-2.5">
                                    <div className="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-500 flex items-center justify-center font-bold text-xs">
                                        2026
                                    </div>
                                    <div className="overflow-hidden">
                                        <p className="text-xs font-bold truncate">{t.clinicName}</p>
                                        <p className="text-[10px] text-emerald-500 flex items-center gap-1 font-semibold">
                                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                            نشط ومتصل
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </aside>

                        <main className="flex-1 p-4 lg:p-6 overflow-y-auto max-h-[calc(100vh-65px)]">
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4 mb-6">
                                <div className="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 shadow-sm">
                                    <div className="flex justify-between items-center text-slate-500 text-xs mb-2">
                                        <span>{t.todayPatients}</span>
                                        <Icon name="users" className="w-4 h-4 text-teal-500" />
                                    </div>
                                    <p className="text-xl lg:text-2xl font-black">{patients.length}</p>
                                    <span className="text-[10px] text-emerald-500 font-bold">سجلات مفعلة</span>
                                </div>
                                <div className="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 shadow-sm">
                                    <div className="flex justify-between items-center text-slate-500 text-xs mb-2">
                                        <span>{t.todayApps}</span>
                                        <Icon name="calendar" className="w-4 h-4 text-emerald-500" />
                                    </div>
                                    <p className="text-xl lg:text-2xl font-black">{appointments.length}</p>
                                    <span className="text-[10px] text-teal-500 font-bold">جدول اليوم</span>
                                </div>
                                <div className="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 shadow-sm">
                                    <div className="flex justify-between items-center text-slate-500 text-xs mb-2">
                                        <span>{t.waitingRoom}</span>
                                        <Icon name="clock" className="w-4 h-4 text-amber-500" />
                                    </div>
                                    <p className="text-xl lg:text-2xl font-black text-amber-500">{appointments.filter(a => a.status === "Waiting").length}</p>
                                    <span className="text-[10px] text-amber-500 font-bold">جاهز للدخول</span>
                                </div>
                                {(userRole === 'system_manager' || userRole === 'admin') && (
                                    <div className="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 shadow-sm">
                                        <div className="flex justify-between items-center text-slate-500 text-xs mb-2">
                                            <span>{t.revenue}</span>
                                            <Icon name="dollar-sign" className="w-4 h-4 text-cyan-500" />
                                        </div>
                                        <p className="text-xl lg:text-2xl font-black text-emerald-500">{todayIncome.toLocaleString()} <span className="text-xs">{t.iqd}</span></p>
                                        <span className="text-[10px] text-slate-400">إجمالي الصندوق اليوم (خاص بالمدير والأدمن)</span>
                                    </div>
                                )}
                            </div>

                            {/* TAB: PATIENT HEALTH PORTAL */}
                            {activeTab === 'patient_portal' && (
                                <div className="p-5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 space-y-6">
                                    <div className="flex flex-wrap items-center justify-between gap-4 border-b pb-4 border-slate-200 dark:border-slate-800">
                                        <div>
                                            <h2 className="text-base font-bold text-teal-500 flex items-center gap-2">
                                                <span>🩺</span>
                                                <span>بوابة الحالة الصحية وسجل المريض الاحترافي (FDI System)</span>
                                            </h2>
                                            <p className="text-xs text-slate-400">نظام ترقيم الأسنان الدولي FDI والتصنيف الطبي المعتمد ICD-10</p>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <label className="text-xs font-bold text-slate-400">اختر المريض:</label>
                                            <select 
                                                value={selectedPatientPortalId} 
                                                onChange={e => setSelectedPatientPortalId(Number(e.target.value))}
                                                className="bg-slate-100 dark:bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-bold outline-none">
                                                {patients.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    {(() => {
                                        const curPat = patients.find(p => p.id === selectedPatientPortalId) || patients[0];
                                        const curRxList = prescriptions.filter(rx => rx.patientId === curPat.id || rx.patientName === curPat.name);
                                        return (
                                            <div className="space-y-6">
                                                <div className="p-5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 space-y-3">

                                            <thead>
                                                <tr className="border-b border-slate-200 dark:border-slate-800 text-slate-400">
                                                    <th className="py-3 px-3">التاريخ</th>
                                                    <th className="py-3 px-3">البيان</th>
                                                    <th className="py-3 px-3">المبلغ</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 dark:divide-slate-800/40">
                                                {finances.map(item => (
                                                    <tr key={item.id}>
                                                        <td className="py-3 px-3 font-mono">{item.date}</td>
                                                        <td className="py-3 px-3 font-bold">{item.title}</td>
                                                        <td className={`py-3 px-3 font-mono font-bold ${item.type === 'Income' ? 'text-emerald-500' : 'text-rose-500'}`}>{item.amount.toLocaleString()} {t.iqd}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'reports' && userRole === 'system_manager' && (
                                <div className="space-y-6">
                                    <h2 className="text-base font-bold">{t.reports} (مدير النظام)</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {doctors.map(doc => (
                                            <div key={doc.id} className="p-5 rounded-2xl border bg-slate-50 dark:bg-slate-950 space-y-2">
                                                <h3 className="text-sm font-bold text-teal-500">{doc.name}</h3>
                                                <p className="text-xs">نسبة الأرباح: <b>{doc.percentage}%</b></p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    {/* CONFLICT PREVENTION ALERT MODAL */}
                    {conflictAlert && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="w-full max-w-sm p-6 bg-white dark:bg-slate-900 rounded-3xl border border-amber-500/40 text-center space-y-4 shadow-2xl">
                                <div className="w-12 h-12 rounded-full bg-amber-500/20 text-amber-500 flex items-center justify-center text-2xl mx-auto">⚠️</div>
                                <h3 className="font-black text-sm">تنبيه تعارض موعد!</h3>
                                <p className="text-xs text-slate-500 dark:text-slate-300 leading-relaxed">
                                    {conflictAlert.doctorName} لديه موعد محجوز مسبقاً للمريض <b className="text-amber-500">({conflictAlert.existingPatient})</b> في التاريخ {conflictAlert.date} الساعة {conflictAlert.time}.
                                </p>
                                <p className="text-[11px] text-teal-500 font-semibold bg-teal-500/10 p-2 rounded-xl">
                                    💡 اطمئن! يمكنك اختيار وقت آخر أو طبيب مختلف.
                                </p>
                                <button onClick={() => setConflictAlert(null)} className="w-full py-2 bg-amber-500 text-white font-bold text-xs rounded-xl">فهمت ذلك</button>
                            </div>
                        </div>
                    )}

                    {/* AUTOMATIC PRESCRIPTION CREATION MODAL */}
                    {prescriptionModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="w-full max-w-lg p-6 bg-white dark:bg-slate-900 rounded-3xl border border-teal-500/30 space-y-4 shadow-2xl">
                                <div className="flex justify-between items-center border-b pb-3 border-slate-200 dark:border-slate-800">
                                    <div className="flex items-center gap-2">
                                        <span className="text-2xl text-teal-500 font-black">℞</span>
                                        <h3 className="font-bold text-sm">كتابة وصفة طبية (Rx)</h3>
                                    </div>
                                    <button onClick={() => setPrescriptionModal(null)} className="text-slate-400">✕</button>
                                </div>
                                <form onSubmit={handleSavePrescription} className="space-y-4 text-xs">
                                    <div className="p-3 bg-teal-500/10 rounded-xl border border-teal-500/20">
                                        <p className="font-bold text-teal-600 dark:text-teal-400">الإجراء:</p>
                                        <p className="text-slate-700 dark:text-slate-200">{prescriptionModal.procedure}</p>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="font-bold text-slate-400">الأدوية والجرعات:</label>
                                        {rxMedList.map((m, idx) => (
                                            <div key={idx} className="flex gap-2">
                                                <input type="text" placeholder="اسم الدواء" value={m.name} onChange={e => {
                                                    const updated = [...rxMedList]; updated[idx].name = e.target.value; setRxMedList(updated);
                                                }} className="flex-1 bg-slate-100 dark:bg-slate-950 p-2 rounded-xl outline-none border" />
                                                <input type="text" placeholder="الجرعة" value={m.dose} onChange={e => {
                                                    const updated = [...rxMedList]; updated[idx].dose = e.target.value; setRxMedList(updated);
                                                }} className="flex-1 bg-slate-100 dark:bg-slate-950 p-2 rounded-xl outline-none border" />
                                            </div>
                                        ))}
                                    </div>

                                    <button type="submit" className="w-full py-2.5 bg-teal-500 text-white font-bold rounded-xl shadow">
                                        حفظ الوصفة (تُسجل لمدير النظام، الأدمن، والمريض)
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* PRINT PRESCRIPTION (℞) MODAL */}
                    {createdRxPrint && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="w-full max-w-md p-6 bg-white text-slate-900 rounded-3xl shadow-2xl space-y-4 font-mono text-xs">
                                <div className="text-center border-b pb-3 border-slate-200">
                                    <div className="text-3xl font-black text-teal-600 mb-1">℞</div>
                                    <h3 className="font-black text-base">عيادة ريما لطب الأسنان</h3>
                                    <p className="text-[10px] text-slate-500">وصفة طبية رسمية</p>
                                </div>
                                <div className="space-y-1 text-[11px] border-b pb-2">
                                    <div><b>المريض:</b> {createdRxPrint.patientName}</div>
                                    <div><b>الطبيب:</b> {createdRxPrint.doctorName}</div>
                                    <div><b>الإجراء:</b> {createdRxPrint.procedure}</div>
                                </div>
                                <div className="space-y-1">
                                    {createdRxPrint.medicines.map((m, i) => (
                                        <div key={i} className="p-2 bg-slate-50 rounded border"><b>{m.name}</b> ({m.dose})</div>
                                    ))}
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => handleSendRxWhatsApp(createdRxPrint)} className="flex-1 py-2 bg-emerald-600 text-white font-bold rounded-xl">
                                        إرسال واتساب للمريض
                                    </button>
                                    <button onClick={() => setCreatedRxPrint(null)} className="px-3 py-2 border rounded-xl">إغلاق</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: PATIENT DENTAL CHART & HISTORY */}
                    {selectedPatientChart && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="w-full max-w-4xl p-6 rounded-3xl border bg-white dark:bg-slate-900 max-h-[90vh] overflow-y-auto space-y-6">
                                <div className="flex justify-between items-start border-b pb-4">
                                    <div>
                                        <h3 className="text-lg font-bold text-teal-500">{selectedPatientChart.name}</h3>
                                        <p className="text-xs text-slate-400 font-mono">هاتف: {selectedPatientChart.phone}</p>
                                    </div>
                                    <button onClick={() => setSelectedPatientChart(null)} className="p-2">✕</button>
                                </div>

                                <div className="space-y-3">
                                    <h4 className="text-xs font-bold text-slate-400">مخطط الأسنان التفاعلي (FDI International System):</h4>
                                    <div className="grid grid-cols-8 gap-2 p-4 bg-slate-100 dark:bg-slate-950 rounded-2xl border text-center">
                                        {[18,17,16,15,14,13,12,11, 21,22,23,24,25,26,27,28, 48,47,46,45,44,43,42,41, 31,32,33,34,35,36,37,38].map(toothNum => (
                                            <button 
                                                key={toothNum}
                                                onClick={() => { setSelectedToothModal(toothNum); setToothStatusText(selectedPatientChart.teethState[toothNum] || ""); }}
                                                className={`p-2 rounded-xl border text-[11px] font-mono ${selectedPatientChart.teethState[toothNum] ? 'bg-amber-500/10 border-amber-500/30 text-amber-500' : 'bg-white dark:bg-slate-900'}`}
                                                title={FDI_TEETH_INFO[toothNum]}>
                                                <span>🦷</span>
                                                <span className="font-bold">#{toothNum}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {selectedToothModal && (
                                    <div className="p-3 bg-slate-100 dark:bg-slate-800 rounded-xl space-y-2 text-xs">
                                        <div className="flex items-center gap-3">
                                            <span>سن #{selectedToothModal} ({FDI_TEETH_INFO[selectedToothModal]}):</span>
                                            <select value={toothStatusText} onChange={e => setToothStatusText(e.target.value)} className="flex-1 bg-white dark:bg-slate-900 p-1.5 rounded border">
                                                <option value="">-- اختر الحالة أو المرض --</option>
                                                {DENTAL_DISEASES.map((dis, idx) => <option key={idx} value={dis.name}>{dis.id}: {dis.name} ({dis.en})</option>)}
                                            </select>
                                        </div>
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="ملاحظات الطبيب المخصصة..." value={toothStatusText} onChange={e => setToothStatusText(e.target.value)} className="flex-1 bg-white dark:bg-slate-900 p-1.5 rounded border" />
                                            <button onClick={handleSaveToothState} className="px-4 py-1.5 bg-teal-500 text-white font-bold rounded">
                                                حفظ الحالة + كتابة وصفة (Rx)
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
</body>
</html>
